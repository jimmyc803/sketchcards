# Free Supabase projects pause after a week without activity. This pings the
# REST API every 3 days so yours stays awake. Optional: it does nothing until
# you add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets not set; skipping."
            exit 0
          fi
          # RLS returns an empty list for anonymous requests; the request itself counts as activity.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/decks?select=id&limit=1")
          echo "Supabase responded with HTTP $status"
          [ "$status" -lt 500 ]
